services:
  postgres_db:
    image: postgres:16
    platform: linux/amd64
    container_name: mi_proyecto_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    platform: linux/amd64
    container_name: mi_proyecto_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: saraulitape
    ports:
      - "80:80"
volumes:
  postgres_data:
  pgadmin_data:
