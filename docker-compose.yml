services:
  postgres_db:
    image: postgres:16
    platform: linux/amd64
    container_name: mi_proyecto_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-network
  pgadmin:
    image: dpage/pgadmin4
    platform: linux/amd64
    container_name: mi_proyecto_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: saraulitape
    ports:
      - "5050:80"
    networks:
      - saas-network
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile   # <-- Apunta a la nueva ruta
    container_name: saas_app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - saas-network

  # Servidor Web Nginx
  webserver:
    image: nginx:alpine
    container_name: saas_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - saas-network
    depends_on:
      - app
  # Redis (Caché y Colas)
  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - saas-network
  # Node.js / Vite (Frontend React + TypeScript)
  node:
    image: node:20-alpine
    container_name: saas_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge
volumes:
  postgres_data:
    driver: local
  
